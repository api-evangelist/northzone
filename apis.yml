aid: northzone
name: Northzone
description: >-
  Northzone is a multi-stage venture capital firm founded in 1996 in Oslo and now headquartered in
  London, with additional offices in New York, Stockholm, Berlin and Amsterdam. The firm partners with
  founders across the United States and Europe from Seed through Growth, positioning itself as a single
  long-term partner from the first check all the way to IPO, with check sizes ranging from roughly $1M
  to $50M. Over nearly three decades Northzone has raised 13 funds, backed more than 250 companies,
  produced 18 unicorns and 14 IPOs, and reports $3.1bn+ in assets under management; its most recent
  flagship vehicle raised approximately €1bn. Northzone invests broadly across AI, enterprise software,
  fintech, consumer, healthcare, climate and energy, and infrastructure and developer tools, and is
  known for early backing of category creators including Spotify, Klarna, Trustpilot, Kahoot!, Personio,
  TrueLayer, Avito and iZettle. The firm supports portfolio companies through a Platform team and a
  network of 500+ operators drawn from companies such as OpenAI, Anthropic and Stripe.
